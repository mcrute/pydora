name: build

on:
- push
- pull_request

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest

        python-version:
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
        - "3.15"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          pip install tox
          tox -e tests,release
